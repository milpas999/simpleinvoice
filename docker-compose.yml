# SimpleInvoice — single-command local stack (db + backend + frontend).
#
# Usage:
#   docker compose up          # start everything, build images if needed
#   docker compose up --build  # force rebuild after Dockerfile/deps changes
#   docker compose down        # stop (add -v to also drop the postgres volume)
#
# All configuration is sourced from the root-level .env file (see .env.example).
# Backend and frontend source directories are bind-mounted into their
# containers so code edits on the host are picked up live (Nest --watch /
# Vite HMR) without rebuilding the image.

services:
  db:
    image: postgres:16-alpine
    container_name: simpleinvoice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - simpleinvoice-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: simpleinvoice-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      # Inside the compose network the database is always reachable at the
      # "db" service name, regardless of what DB_HOST is set to in .env
      # (that value is only used when running the backend outside Docker).
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      # Force polling-based file watching so Nest's --watch mode reliably
      # picks up changes made on the host through the bind mount below.
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - simpleinvoice-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: simpleinvoice-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - simpleinvoice-network
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  simpleinvoice-network:
    driver: bridge
